<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanez Pure™ OS Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            text-align: center;
        }

        .logo-container img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #25d366;
            object-fit: cover;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.25rem;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #25d366;
        }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #25d366;
            color: #000000;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        button.submit-btn:active {
            opacity: 0.8;
        }

        .code-card {
            display: none;
            margin-top: 20px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            position: relative;
        }

        .code-display {
            font-family: monospace;
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 4px;
            color: #38bdf8;
            margin: 10px 0;
            user-select: all;
        }

        .copy-btn {
            background-color: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: all 0.2s;
        }

        .copy-btn:active {
            background-color: #25d366;
            color: #000000;
        }

        .status {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="/logo.jpg" alt="Lanez Pure Logo" onerror="this.style.display='none'">
        </div>
        <h1>LANEZ PURE™ OS</h1>
        <p class="subtitle">Enter your WhatsApp number with country code to link your account.</p>

        <form id="pairForm">
            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" placeholder="e.g. 233500000000" required>
            </div>
            <button type="submit" class="submit-btn" id="btnText">Get Pairing Code</button>
        </form>

        <div class="code-card" id="codeCard">
            <label>Your Pairing Code:</label>
            <div class="code-display" id="codeDisplay">------</div>
            <button class="copy-btn" id="copyBtn" onclick="copyCode()">Tap to Copy 📋</button>
        </div>

        <p class="status" id="statusText"></p>
    </div>

    <script>
        const socket = io();
        const pairForm = document.getElementById('pairForm');
        const phoneInput = document.getElementById('phone');
        const codeCard = document.getElementById('codeCard');
        const codeDisplay = document.getElementById('codeDisplay');
        const statusText = document.getElementById('statusText');
        const btnText = document.getElementById('btnText');

        pairForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const phone = phoneInput.value.trim().replace(/[^0-9]/g, '');

            if (!phone) {
                statusText.innerText = "Please enter a valid phone number.";
                return;
            }

            btnText.innerText = "Generating Code...";
            statusText.innerText = "Connecting to WhatsApp servers...";
            codeCard.style.display = "none";

            // Emit pairing request to Node.js backend
            socket.emit('request-code', phone);
        });

        socket.on('pairing-code', (data) => {
            btnText.innerText = "Get Pairing Code";
            if (data.code) {
                codeDisplay.innerText = data.code;
                codeCard.style.display = "block";
                statusText.innerText = "Enter this code in WhatsApp under Linked Devices.";
            } else {
                statusText.innerText = "Failed to generate code. Please try again.";
            }
        });

        function copyCode() {
            const code = codeDisplay.innerText;
            if (code && code !== '------') {
                navigator.clipboard.writeText(code).then(() => {
                    const copyBtn = document.getElementById('copyBtn');
                    copyBtn.innerText = "Copied! ✅";
                    copyBtn.style.backgroundColor = "#25d366";
                    copyBtn.style.color = "#000000";

                    setTimeout(() => {
                        copyBtn.innerText = "Tap to Copy 📋";
                        copyBtn.style.backgroundColor = "#334155";
                        copyBtn.style.color = "#f8fafc";
                    }, 2000);
                }).catch(err => {
                    console.error('Copy failed:', err);
                });
            }
        }
    </script>
</body>
</html>
